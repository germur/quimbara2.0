name: Update UFC data
on:
  schedule:
    - cron: '0 12 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: ufc-data-refresh
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run test:data && npm run test:puntaje
      - id: identities
        run: npm run data:identities
        continue-on-error: true
      # Each ingestion preserves the last usable data on source failure.
      # The final step reports any tolerated failure; green cannot hide it.
      - id: base
        run: npm run data:update
        continue-on-error: true
      - id: rankings
        run: npm run data:rankings
      - id: records
        run: npm run data:records
        continue-on-error: true
      - id: details
        run: npm run data:details
        continue-on-error: true
      - run: npm run data:overrides
      - id: history
        run: npm run data:peleas -- --limite=50
        continue-on-error: true
      - id: images
        run: npm run data:images
        continue-on-error: true
      - name: Verify ingestion before publishing
        env:
          OUTCOMES: ${{ toJSON(steps) }}
        run: node scripts/verify-ingestion.mjs
      - uses: actions/cache@v4
        with:
          path: .rag/model-cache
          key: semantic-model-minilm-fp32-v1
      - uses: actions/cache@v4
        with:
          path: |
            .rag/vector-cache.json
            .rag/preguntas-vec.json
          key: semantic-vectors-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: semantic-vectors-v1-
      - name: Refresh semantic search
        run: node scripts/sync-event-urls.mjs && npm run rag:chunk -- --write && npm run rag:embed -- --publicar && npm run audit:search && npm run rag:eval
      - run: npm run gen:og
      # Validate the candidate BEFORE committing data that triggers Netlify.
      - run: npm run audit:peleadores && npm run audit:identities
      - run: npm run build
      - run: npm run audit:schema && npm run audit:events && npm run audit:images -- --dist
      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'chore(data): actualización validada de UFC'
          file_pattern: 'src/data/*.json public/fighters/* public/og/cartas/* public/_redirects public/buscador/indice.json'
          commit_user_name: Quimbara Bot
          commit_user_email: bot@quimbara.local
      - name: Verify production deployment
        run: node scripts/verify-deploy.mjs "$(git rev-parse HEAD)"
      - run: npm run indexnow
      - name: Report source failures
        if: always()
        env:
          OUTCOMES: ${{ toJSON(steps) }}
        run: |
          node --input-type=module -e 'import fs from "node:fs";const h=JSON.parse(fs.readFileSync("src/data/data-health.json","utf8"));fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,"## Data-source health\n\n"+Object.entries(h).map(([k,v])=>"- "+k+": "+(v.ok?"OK":"degraded")+"; "+JSON.stringify(v.detail)).join("\n"));if(h.images?.detail?.pendingRetries)console.log("::warning::Athlete images awaiting retry: "+h.images.detail.pendingRetries);'
          node --input-type=module -e 'const steps=JSON.parse(process.env.OUTCOMES); const failed=Object.entries(steps).filter(([,v])=>v.outcome==="failure"); if(failed.length){console.error("Source failures:",failed.map(([k])=>k).join(", "));process.exit(1)}'
