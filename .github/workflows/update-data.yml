name: Update UFC data

on:
  schedule:
    # Lunes a las 06:00 UTC (08:00 Madrid en invierno, 07:00 Madrid en verano)
    - cron: '0 6 * * 1'
  workflow_dispatch: # permite dispararlo a mano desde la pestaña "Actions"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4.2

      - name: Setup Node
        uses: actions/setup-node@v4.2
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install deps
        run: npm ci

      - name: Fetch UFC data (Wikipedia + Sherdog + API-Sports)
        run: npx tsx scripts/fetch-ufc-data.ts
        env:
          API_SPORTS_KEY: ${{ secrets.API_SPORTS_KEY }}

      - name: Commit changes (si los hay)
        uses: stefanzweifel/git-auto-commit-action@v5.1
        with:
          commit_message: 'chore(data): actualización automática de eventos UFC'
          file_pattern: 'src/data/events.json'
          commit_user_name: 'Quimbara Bot'
          commit_user_email: 'bot@quimbara.local'
